# Every default, written out. Experiment configs only need to list what they change.
name: base
seeds: 30
seed_offset: 0
n_jobs: -1                # parallel workers (-1 = all cores)

env:
  type: box               # box | random_features | explicit
  d: 6                    # feature dimension (box has 2^d actions)
  n_contexts: 20          # S
  n_actions: 8            # K, random_features only
  feature_norm: 1.0       # L
  scale_min: 0.5          # box: per-context feature scales in [scale_min, 1]
  rotate: false           # random rotation of features and parameters (rewards unchanged)

labelers:
  k: 11                   # keep odd
  theta_norm: 3.0         # B; at 3.0 labels agree with the stronger preference ~65% of the time
  population: symmetric   # symmetric | explicit
  center_norm: 0.4        # shared center length, / B
  spread: 0.6             # radius of each labeler's individual offset, / B
  strategic_fraction: 0.0 # floor(fraction * k) labelers lie
  strategy: exaggerate    # exaggerate | bury | truthful
  strategy_strength: 5.0  # exaggerate: scale factor; bury: opposition strength

data:
  n_per_labeler: 500      # comparisons per labeler

estimation:               # shared by every data-based algorithm
  ridge: 0.001
  conf_scale: 3.0         # c, calibrated in sanity.py: ~95-99% of true parameters inside their sets
  delta: 0.1

algorithms: [pooled_btl, maxmin, psw, pmomle]
algo_params: {}           # e.g. {pmomle: {conf_scale: 1.0}}
sweep: {}
